[project]
name = "temporal-app"
version = "0.1.0"
description = "MongoDB x Temporal Partner Reference Architecture, Part 1: fresh vector store (S3 -> Temporal -> Voyage -> Atlas)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "temporalio[opentelemetry]>=1.9,<2",
    "pymongo>=4.9,<5",
    "voyageai>=0.3,<1",
    "boto3>=1.35,<2",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pypdf>=5,<6",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",

    # --- Atlas Agent Engine runtime (mongodb_agent_engine/) ---
    # The names the current `agentengine create` scaffold declares. On PyPI they are
    # 0.0.0 placeholders: the hosted builder installs the real SDK from wheels in
    # its base image and skips these names, so no [tool.uv.sources] pin is
    # declared. A git pin sent the builder to a private repo it cannot clone.
    "agent-engine-runner-shared[mongodb]",
    "agent-engine-sdk-langgraph",
    # Optional dependency of the SDK: App.deep_agent() imports it lazily, so an
    # agent that uses deep agents has to declare it. The SDK's own dev extra
    # pins this exact version; matching it keeps us on the tested combination.
    "deepagents==0.5.3",
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.4.0",
    "langchain-openai>=1.1.12",
    "langchain-google-genai>=2.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "infra", "mongodb_agent_engine"]
